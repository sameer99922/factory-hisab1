name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Assets & Capacitor Project
        run: |
          mkdir -p www
          cp Factory_Hisab* www/index.html || cp *.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Factory Hisab" "com.sameer.factoryhisab" --web-dir www
          npx cap add android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: Factory-Hisab-Clean-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
