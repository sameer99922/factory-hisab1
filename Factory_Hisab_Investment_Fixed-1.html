<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factory Hisab</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Arial;background:#edf1ee;color:#17231e}.app{max-width:850px;margin:auto;min-height:100vh;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;--bg:#f5f8f5;--ink:#15251e;--muted:#728078;--card:#fff;--line:#dce5df;--accent:#16835d;--soft:#e2f4eb}
body.t-dark{background:#06111d}.t-dark .app{--bg:#06111d;--ink:#f5f9ff;--muted:#a6b8c9;--card:#0e2032;--line:#244158;--accent:#24c8ff;--soft:#102f49;background:radial-gradient(ellipse at 50% 0%,#173b59 0%,#06111d 60%);color:var(--ink)}
body.t-light .app{--bg:#f7fbff;--ink:#10213b;--muted:#61738d;--card:#fff;--line:#dce8f5;--accent:#1879e8;--soft:#e1f0ff;background:linear-gradient(160deg,#fff 0%,#f3f8ff 68%,#d8efff 100%)}
body.t-neon{background:#010a08}.t-neon .app{--bg:#020b08;--ink:#f1fff8;--muted:#91b3a2;--card:#071a14;--line:#124c36;--accent:#00ed91;--soft:#0b3324;background:radial-gradient(ellipse at 50% 0%,#073f2b 0%,#020b08 58%);color:var(--ink)}
body.t-green .app{--bg:#f8f5ed;--ink:#24352b;--muted:#788578;--card:#fffdf7;--line:#e4e5d6;--accent:#33865e;--soft:#e4f2e6;background:linear-gradient(160deg,#f8f5ed,#f4fbf4 60%,#dbeee1)}
.top{height:72px;padding:0 17px;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--card) 88%,transparent);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}
.iconbtn{height:43px;width:43px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:23px;display:grid;place-items:center}
.logo{width:40px;height:40px;border-radius:13px;background:var(--accent);color:white;display:grid;place-items:center;font-weight:900}.title{font-size:18px;font-weight:850}.subtitle{font-size:12px;color:var(--muted)}.spacer{flex:1}
.menu{display:none;position:absolute;right:14px;top:62px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px #0003;width:240px;padding:8px;z-index:8}.menu.open{display:block}.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:13px;border-radius:10px;font-weight:650}.menu button:hover{background:var(--soft)}
main{padding:23px 18px 40px}.hero{margin-bottom:20px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--accent);text-transform:uppercase}.hero h1{font-size:clamp(27px,6vw,38px);margin:7px 0 4px;letter-spacing:-1px}.hint{color:var(--muted);font-size:13px}.factorygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.factory{min-height:170px;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:19px 14px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;box-shadow:0 8px 24px #071b150b}
.factoryicon{width:60px;height:60px;border-radius:20px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:27px;font-weight:900}.factoryname{font-size:17px;font-weight:800}.factory small{font-size:11px;color:var(--muted)}
body.t-dark .factory{background:linear-gradient(145deg,#10283b,#0b1a29);border-color:#24445b;box-shadow:0 10px 30px #0003}body.t-dark .factoryicon{background:linear-gradient(135deg,#00aaff,#315aff);color:white;border-radius:50%}
body.t-light .factory{border-radius:24px;box-shadow:0 10px 25px #175b9d0b}body.t-light .factoryicon{border-radius:18px;background:linear-gradient(145deg,#d5ebff,#f1f8ff)}
body.t-neon .factory{border:1px solid #0b714a;background:linear-gradient(145deg,#071d15,#04100c);box-shadow:0 0 0 1px #00ed9110,0 10px 28px #0005}body.t-neon .factoryicon{border:1px solid #00ed91;background:#073322;color:#00ed91;border-radius:50%;box-shadow:0 0 18px #00ed9133}
body.t-green .factory{border-radius:16px 26px 16px 26px;box-shadow:0 8px 20px #395b3210}body.t-green .factoryicon{border-radius:50%;background:linear-gradient(145deg,#c6e8cf,#f3f8e9)}
.addfactory{border:1.5px dashed var(--accent);background:transparent}.addfactory .factoryicon{background:var(--soft);font-size:32px}
.footer{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}
.panel{border:1px solid var(--line);background:var(--card);border-radius:17px;padding:16px;margin:12px 0;color:var(--ink)}.btn{border:0;border-radius:12px;background:var(--accent);color:white;font-weight:800;padding:11px 14px}.btn2{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:10px 12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.stat span{display:block;font-size:11px;color:var(--muted)}.stat b{font-size:18px}.tablewrap{overflow:auto}table{width:100%;min-width:640px;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted)}.rowtitle{display:flex;justify-content:space-between;align-items:center;gap:10px}.drawerbg{display:none;position:fixed;inset:0;background:#0008;z-index:9}.drawerbg.open{display:block}.drawer{position:fixed;left:0;top:0;bottom:0;width:min(300px,85vw);background:#ffffff;color:#15251e;opacity:1;z-index:10;padding:20px;transform:translateX(-105%);transition:.2s;box-shadow:20px 0 50px #0005;border-right:1px solid #dce5df;isolation:isolate}.t-dark .drawer{background:#0e2032;color:#f5f9ff;border-right-color:#244158}.t-neon .drawer{background:#071a14;color:#f1fff8;border-right-color:#124c36}.t-green .drawer{background:#fffdf7;color:#24352b;border-right-color:#e4e5d6}.drawer.open{transform:translateX(0)}.drawer button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #dce5df;padding:15px 10px;background:transparent;color:inherit;font-weight:700;opacity:1}.t-dark .drawer button{border-bottom-color:#244158}.t-neon .drawer button{border-bottom-color:#124c36}.drawer button:hover{background:var(--soft);border-radius:9px}
@media(max-width:500px){main{padding:20px 13px}.factory{min-height:150px;padding:14px 8px}.factoryicon{width:54px;height:54px}.formgrid{grid-template-columns:1fr}.top{padding:0 11px}}
@media print{.top,.drawer,.drawerbg,.no-print{display:none!important}main{padding:0}}
</style><style>
/* Entry form: clearly separated hand-drawn-style boxes */
#entryForm{border:2px solid var(--accent);border-radius:20px;padding:16px;background:var(--card)}
#entryForm .formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#entryForm .field{border:1.5px solid var(--line);border-radius:12px;padding:9px;background:var(--bg);min-width:0}
#entryForm .field label{display:block;font-size:12px;line-height:1.35;letter-spacing:.1px;font-weight:900;color:var(--accent);overflow-wrap:anywhere}
#entryForm .field input,#entryForm .field select{border:2px solid var(--line);border-radius:8px;min-height:45px;font-size:16px;font-weight:750;background:var(--card)}
#entryForm .field input:focus,#entryForm .field select:focus{outline:2px solid var(--accent);outline-offset:1px}
#entryForm .field:first-child{border-style:solid}
@media(max-width:500px){#entryForm .formgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#entryForm{padding:10px}#entryForm .field{padding:7px 6px}#entryForm .field input,#entryForm .field select{padding:8px 6px;font-size:14px}}
.foldergrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.foldercard{min-height:125px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:17px;padding:15px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:8px;box-shadow:0 7px 22px #0000000b}.foldericon{font-size:28px}.foldername{font-weight:850;line-height:1.3}.foldercard small{color:var(--muted)}@media(max-width:500px){.foldergrid{grid-template-columns:1fr 1fr}.foldercard{padding:12px;min-height:118px}}
</style></head>
<body class="t-light"><div class="app">
<header class="top"><button class="iconbtn" id="hamb" aria-label="Open menu">☰</button><div class="logo">FH</div><div><div class="title" id="appTitle">Factory Hisab</div><div class="subtitle">Factory ledger</div></div><div class="spacer"></div><button class="btn2" id="homeShortcut" onclick="page('home')" aria-label="Back to main menu" style="white-space:nowrap;padding:9px 11px;font-weight:800">⌂ Home</button><button class="iconbtn" id="dots" aria-label="More options">⋮</button>
<div class="menu" id="moreMenu"><button onclick="showThemes()">🎨 &nbsp; Themes / Front Designs</button><button onclick="page('investment')">▤ &nbsp; Total Investment</button><button onclick="page('manage')">⚙ &nbsp; Manage Factories</button><button onclick="page('invoice')">▧ &nbsp; Invoice Styles & Print</button><button onclick="page('business')">◈ &nbsp; Brand / Business</button></div></header>
<main id="main"></main></div>
<div class="drawerbg" id="drawerbg"></div><nav class="drawer" id="drawer"><div class="logo">FH</div><h2>Factory Hisab</h2><button onclick="page('home')">⌂ &nbsp; Front Page</button><button onclick="showThemes()">🎨 &nbsp; Themes / Front Designs</button><button onclick="page('investment')">▤ &nbsp; Total Investment</button><button onclick="page('manage')">⚙ &nbsp; Manage Factories</button><button onclick="page('invoice')">▧ &nbsp; Invoice Styles & Print</button><button onclick="page('business')">◈ &nbsp; Brand / Business</button></nav>
<script>
const themes=[{id:"dark",name:"Dark Mountain",cls:"t-dark",desc:"Dark premium blue"},{id:"light",name:"Clean Light",cls:"t-light",desc:"White and sky blue"},{id:"neon",name:"Neon Green",cls:"t-neon",desc:"Black and electric green"},{id:"green",name:"Green Fresh",cls:"t-green",desc:"Fresh botanical green"}];
let factories=load("fh_factories",[{id:"f1",name:"Qari Sahib"},{id:"f2",name:"John Tex"},{id:"f3",name:"MI Factory"}]),entries=load("fh_entries",[]),theme=localStorage.getItem("fh_theme")||"light",view="home",selected=factories[0]?.id,selectedMonth=new Date().toISOString().slice(0,7),editing=null,ledgerStyle=localStorage.getItem("fh_ledger_style")||"register";
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function save(){localStorage.setItem("fh_factories",JSON.stringify(factories));localStorage.setItem("fh_entries",JSON.stringify(entries))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function cash(n){return (Number(n)||0).toLocaleString("en-PK",{maximumFractionDigits:2})}
function getF(id){return factories.find(f=>f.id===id)}function es(id){return entries.filter(e=>e.factoryId===id)}function calc(e){let sale=(+e.saleRate||0)*(+e.saleMann||0),buy=(+e.buyRate||0)*(+e.buyMann||0),commissionTotal=(+e.commission||0)*(+e.saleMann||0);return{sale,buy,commissionTotal,profit:sale-buy-commissionTotal,balance:sale-(+e.received||0)}}
function applyTheme(id){theme=id;localStorage.setItem("fh_theme",id);document.body.className=themes.find(t=>t.id===id)?.cls||"t-light";if(view==="themes")render();else render()}
function showThemes(){document.getElementById("moreMenu").classList.remove("open");closeDrawer();view="themes";render()}
function page(p){view=p;try{history.pushState({fhPage:p},"","#"+p)}catch(e){}document.getElementById("moreMenu").classList.remove("open");closeDrawer();render()}
// Android/browser Back: return to the main menu from any inner screen.
if(!window.__fhBackHandlerInstalled){window.__fhBackHandlerInstalled=true;try{history.replaceState({fhPage:"home"},"",location.pathname+location.search+"#home");history.pushState({fhPage:"home"},"",location.pathname+location.search+"#home")}catch(e){}window.addEventListener("popstate",function(){if(view!=="home"){view="home";render();try{history.pushState({fhPage:"home"},"",location.pathname+location.search+"#home")}catch(e){}}});}
function closeDrawer(){document.getElementById("drawer").classList.remove("open");document.getElementById("drawerbg").classList.remove("open")}
document.getElementById("dots").onclick=()=>document.getElementById("moreMenu").classList.toggle("open");document.getElementById("hamb").onclick=()=>{document.getElementById("drawer").classList.add("open");document.getElementById("drawerbg").classList.add("open")};document.getElementById("drawerbg").onclick=closeDrawer;
function home(){return `<div class="hero"><div class="eyebrow">Factory directory</div><h1>Choose Factory</h1><div class="hint">Tap to open hisaab. Factory delete karne ke liye naam ko press karke rakhein.</div></div><div class="factorygrid">${factories.map(f=>`<button class="factory" onpointerdown="startFactoryPress(event, '${f.id}')" onpointerup="cancelFactoryPress()" onpointerleave="cancelFactoryPress()" onpointercancel="cancelFactoryPress()" oncontextmenu="event.preventDefault();deleteF('${f.id}')" onclick="factoryTap(event, '${f.id}')"><span class="factoryicon">${esc(f.name.trim()[0]?.toUpperCase()||"F")}</span><span class="factoryname">${esc(f.name)}</span></button>`).join("")}<button class="factory addfactory" onclick="addFactory()"><span class="factoryicon">＋</span><span class="factoryname">Add Factory</span><small>New factory</small></button></div>`}
function themePage(){return `<div class="hero"><div class="eyebrow">Personalize app</div><h1>Themes / Front Designs</h1><div class="hint">Aapki marked picture mein se sirf 4 unmarked designs rakhe hain. Theme select karte hi front page badal jayega.</div></div><div class="factorygrid">${themes.map(t=>`<button class="factory" onclick="applyTheme('${t.id}')"><span class="factoryicon">${theme===t.id?"✓":"◈"}</span><span class="factoryname">${t.name}</span><small>${t.desc}${theme===t.id?" · Selected":""}</small></button>`).join("")}</div><div class="footer">Themes menu se khulti hain — front page par theme selector nahi hai.</div><div class="actions"><button class="btn2" onclick="page('home')">← Back to Front Page</button></div>`}
function monthName(key){if(!key)return "Month";let [y,m]=key.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"})}
function monthsForFactory(id){return [...new Set(es(id).map(e=>(e.date||"").slice(0,7)).filter(x=>/^\d{4}-\d{2}$/.test(x)))].sort().reverse()}
function openLedger(id){selected=id;selectedMonth=new Date().toISOString().slice(0,7);editing=null;view="ledger";render()}
function openMonthLedger(id,month){selected=id;selectedMonth=month;view="ledger";render()}
function setLedgerStyle(v){ledgerStyle=v;localStorage.setItem("fh_ledger_style",v);render()}
function monthFolders(){let f=getF(selected);if(!f)return home();let months=monthsForFactory(f.id);return `<div class="rowtitle"><div><div class="eyebrow">Purana Hisaab</div><h1>${esc(f.name)}</h1><div class="hint">Jis mahine ka hisaab dekhna ho, us par tap karein.</div></div><button class="btn2" onclick="newEntryForMonth('${f.id}',new Date().toISOString().slice(0,7))">← Entry Form</button></div><div class="panel" style="margin-top:16px"><div class="field"><label>Mahina select karein</label><select id="historyMonth">${months.map(m=>{let count=es(f.id).filter(e=>(e.date||"").slice(0,7)===m).length;return `<option value="${m}">${esc(monthName(m))} — ${count} entries</option>`}).join("")||'<option value="">Abhi purana hisaab nahi hai</option>'}</select></div><div class="actions"><button class="btn" ${months.length?'':'disabled'} onclick="openMonthLedger('${f.id}',document.getElementById('historyMonth').value)">Hisaab Dekhein</button><button class="btn2" onclick="newEntryForMonth('${f.id}',new Date().toISOString().slice(0,7))">＋ Nayi Entry</button></div></div>`}
function newEntryForMonth(id,month){selected=id;selectedMonth=month;editing=null;view="entry";render()}
function ledger(){let f=getF(selected);if(!f)return `<div class="panel">Factory nahi mili <button onclick="page('home')">Back</button></div>`;let a=es(f.id).filter(e=>(e.date||"").slice(0,7)===selectedMonth).sort((x,y)=>(x.date||"").localeCompare(y.date||""));let tot=a.reduce((s,e)=>{let c=calc(e);s.sale+=c.sale;s.buy+=c.buy;s.profit+=c.profit;s.received+=+e.received||0;s.balance+=c.balance;return s},{sale:0,buy:0,profit:0,received:0,balance:0});let picker=`<div class="panel no-print"><div class="field"><label>Ledger Style</label><select onchange="setLedgerStyle(this.value)"><option value="register" ${ledgerStyle==="register"?"selected":""}>Register Style</option><option value="cards" ${ledgerStyle==="cards"?"selected":""}>Modern Card Ledger</option><option value="compact" ${ledgerStyle==="compact"?"selected":""}>Compact Business Table</option></select></div></div>`;
let tableRows=a.map(e=>{let c=calc(e);return `<tr><td>${esc(e.date)}</td><td>${esc(e.truck)}</td><td>${cash(e.saleRate)}</td><td>${cash(e.saleMann)}</td><td>${cash(c.sale)}</td><td>${cash(e.buyRate)}</td><td>${cash(e.buyMann)}</td><td>${cash(c.buy)}</td><td>${cash(c.commissionTotal)}</td><td>${cash(c.profit)}</td><td>${cash(e.received)}</td><td>${cash(c.balance)}</td><td><button class="btn2" onclick="editEntry('${e.id}')">Edit</button> <button class="btn2" onclick="deleteEntry('${e.id}')">Delete</button></td></tr>`}).join("");let content="";
if(ledgerStyle==="register"){content=`<div class="panel tablewrap"><table><thead><tr><th>Date</th><th>Truck</th><th>Sale Rate</th><th>Sale Mann</th><th>Sale Total</th><th>Buy Rate</th><th>Buy Mann</th><th>Buy Total</th><th>Commission Total</th><th>Profit</th><th>Received</th><th>Balance</th><th></th></tr></thead><tbody>${tableRows||'<tr><td colspan="13">Is mahine abhi entry nahi hai.</td></tr>'}</tbody></table></div>`}
else if(ledgerStyle==="cards"){content=`<div style="display:grid;gap:12px">${a.map(e=>{let c=calc(e);return `<article class="panel" style="border-radius:20px;border-left:5px solid var(--accent)"><div class="rowtitle"><div><div class="eyebrow">${esc(e.date)}</div><h3 style="margin:3px 0">${esc(e.truck||"No truck number")}</h3></div><span><button class="btn2" onclick="editEntry('${e.id}')">Edit</button> <button class="btn2" onclick="deleteEntry('${e.id}')">Delete</button></span></div><div class="stats" style="margin-top:12px"><div class="stat"><span>Sale · ${cash(e.saleMann)} mann</span><b>${cash(c.sale)}</b></div><div class="stat"><span>Buying · ${cash(e.buyMann)} mann</span><b>${cash(c.buy)}</b></div><div class="stat"><span>Commission Total</span><b>${cash(c.commissionTotal)}</b></div><div class="stat"><span>Profit</span><b>${cash(c.profit)}</b></div><div class="stat"><span>Received</span><b>${cash(e.received)}</b></div><div class="stat"><span>Balance</span><b>${cash(c.balance)}</b></div></div></article>`}).join("")||'<div class="panel">Is mahine abhi entry nahi hai.</div>'}</div>`}
else{content=`<div class="panel"><div class="rowtitle"><div><div class="eyebrow">${esc(monthName(selectedMonth))}</div><h2 style="margin:4px 0">Transactions</h2></div><span class="hint">${a.length} entries</span></div><div class="tablewrap"><table><thead><tr><th>Date / Truck</th><th>Sale</th><th>Buying</th><th>Commission Total</th><th>Profit</th><th>Balance</th><th></th></tr></thead><tbody>${a.map(e=>{let c=calc(e);return `<tr><td><b>${esc(e.date)}</b><br>${esc(e.truck)}</td><td>${cash(c.sale)}<br><small>${cash(e.saleMann)} mann × ${cash(e.saleRate)}</small></td><td>${cash(c.buy)}<br><small>${cash(e.buyMann)} mann × ${cash(e.buyRate)}</small></td><td>${cash(c.commissionTotal)}</td><td><b>${cash(c.profit)}</b></td><td>${cash(c.balance)}</td><td><button class="btn2" onclick="editEntry('${e.id}')">Edit</button> <button class="btn2" onclick="deleteEntry('${e.id}')">Delete</button></td></tr>`}).join("")||'<tr><td colspan="7">Is mahine abhi entry nahi hai.</td></tr>'}</tbody></table></div></div>`}
return `<div class="rowtitle"><div><div class="eyebrow">${esc(f.name)} folder</div><h1>${esc(monthName(selectedMonth))}</h1></div><button class="btn" onclick="newEntryForMonth('${f.id}','${selectedMonth}')">＋ Add Entry</button></div><div class="actions no-print"><button class="btn2" onclick="page('months')">← ${esc(f.name)} folders</button><button class="btn2" onclick="page('quickinvoice')">Print / Invoice</button></div>${picker}<div class="stats" style="margin:15px 0">${Object.entries({"Total Sale":tot.sale,"Total Buying":tot.buy,"Profit":tot.profit,"Received":tot.received,"Balance":tot.balance}).map(([k,v])=>`<div class="stat"><span>${k}</span><b>${cash(v)}</b></div>`).join("")}</div>${content}`}
function newEntry(){editing=null;view="entry";render()}function editEntry(id){editing=id;view="entry";render()}
function entry(){let old=entries.find(e=>e.id===editing)||{},f=getF(old.factoryId||selected)||factories[0];return `<div class="rowtitle"><div><h1>${editing?"Edit Entry":"Add Entry"}</h1><div class="hint">${esc(f?.name||"")}</div></div><button class="btn2" onclick="page('months')">Purana Hisaab</button></div><form id="entryForm" class="panel"><div class="formgrid"><div class="field"><label>Factory</label><select name="factoryId">${factories.map(x=>`<option value="${x.id}" ${x.id===f?.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>Date</label><input type="date" name="date" required value="${esc(old.date||(selectedMonth===new Date().toISOString().slice(0,7)?new Date().toISOString().slice(0,10):selectedMonth+"-01"))}"></div><div class="field"><label>Truck / Slip No.</label><input name="truck" value="${esc(old.truck||"")}"></div><div class="field"><label>SALE RATE (Rs / mann)</label><input name="saleRate" type="number" step=".01" required value="${esc(old.saleRate??"")}"></div><div class="field"><label>SALE MANN (+ partial mann)</label><input name="saleMann" type="number" step=".01" required value="${esc(old.saleMann??"")}"></div><div class="field"><label>BUYING RATE (Rs / mann)</label><input name="buyRate" type="number" step=".01" required value="${esc(old.buyRate??"")}"></div><div class="field"><label>BUYING MANN / WEIGHT</label><input name="buyMann" type="number" step=".01" required value="${esc(old.buyMann??"")}"></div><div class="field"><label>COMMISSION / MANN (Rs)</label><input name="commission" type="number" step=".01" value="${esc(old.commission??"15")}" placeholder="15"><small class="commission-preview" style="display:block;margin-top:6px;color:var(--accent);font-weight:800">Total commission auto calculate hoga</small></div><div class="field"><label>Payment Received</label><input name="received" type="number" step=".01" value="${esc(old.received??"0")}"></div></div><div class="calc-note" style="grid-column:1/-1;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:12px"><b>Auto hisaab:</b> Sale, Buying aur Commission Total khud calculate honge.</div><div class="actions"><button class="btn">Save Entry</button><button class="btn2" type="button" onclick="page('home')">Cancel</button></div></form>`}
function deleteEntry(id){if(!confirm("Is entry ko delete karna hai?"))return;entries=entries.filter(e=>e.id!==id);save();render()}
let factoryPressTimer=null,factoryLongPressed=false;function startFactoryPress(ev,id){factoryLongPressed=false;cancelFactoryPress();factoryPressTimer=setTimeout(()=>{factoryLongPressed=true;factoryAction(id)},650)}function cancelFactoryPress(){if(factoryPressTimer){clearTimeout(factoryPressTimer);factoryPressTimer=null}}function factoryTap(ev,id){if(factoryLongPressed){ev.preventDefault();ev.stopPropagation();factoryLongPressed=false;return}openLedger(id)}function factoryAction(id){let f=getF(id);if(!f)return;let choice=prompt("Factory: "+f.name+"\n1 = Edit Name\n2 = Delete Factory\n0 = Cancel","1");if(choice==="1")renameF(id);else if(choice==="2")deleteF(id)}
function addFactory(){let n=prompt("Factory ka naam:");if(!n?.trim())return;factories.push({id:"f"+Date.now(),name:n.trim()});selected=factories.at(-1).id;save();render()}
function manage(){return `<div class="rowtitle"><h1>Manage Factories</h1><button class="btn" onclick="addFactory()">＋ Add</button></div><div class="panel">${factories.map(f=>`<div class="rowtitle" style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(f.name)}</b><span><button class="btn2" onclick="renameF('${f.id}')">Rename</button> <button class="btn2" onclick="deleteF('${f.id}')">Delete</button></span></div>`).join("")}</div>`}
function renameF(id){let f=getF(id),n=prompt("New factory name:",f?.name);if(n?.trim()){f.name=n.trim();save();render()}}function deleteF(id){if(confirm("Factory aur uska hisaab delete karein?")){factories=factories.filter(f=>f.id!==id);entries=entries.filter(e=>e.factoryId!==id);selected=factories[0]?.id;save();render()}}
function deleteAllEntries(){if(!entries.length){alert("Hisaab pehle se khaali hai.");return}if(!confirm("Tamam factories ka poora hisaab delete karna hai? Factory names rahenge, lekin tamam entries permanently delete ho jayengi."))return;entries=[];save();render();alert("Tamam hisaab delete ho gaya. Total Investment ab zero hai.")}
function investment(){let all=entries.reduce((s,e)=>{let c=calc(e);s.sale+=c.sale;s.buy+=c.buy;s.profit+=c.profit;s.received+=+e.received||0;s.balance+=c.balance;return s},{sale:0,buy:0,profit:0,received:0,balance:0});return `<div class="rowtitle"><h1>Total Investment</h1><button class="btn2" onclick="deleteAllEntries()">Delete All Hisaab</button></div><div class="hint">Delete karne se tamam factories ki entries clear hongi. Factory names safe rahenge.</div><div class="stats" style="margin-top:14px">${Object.entries({"Total Sale":all.sale,"Total Buying":all.buy,"Profit":all.profit,"Received":all.received,"Balance":all.balance,"Factories":factories.length}).map(([k,v])=>`<div class="stat"><span>${k}</span><b>${cash(v)}</b></div>`).join("")}</div>`}
function business(){return `<h1>Brand / Business</h1><div class="hint">Yahan company ka naam set karein. Invoice par naam aur initials ka monogram khud aa jayega.</div><form id="brandForm" class="panel"><div class="field"><label>Company / Business Name</label><input name="brand" value="${esc(localStorage.getItem("fh_brand")||"Sameer Baden Commission")}" required></div><div class="field" style="margin-top:12px"><label>Monogram Preview (automatic)</label><div class="logo" id="monoPreview">${esc(monogram(localStorage.getItem("fh_brand")||"Sameer Baden Commission"))}</div></div><div class="actions"><button class="btn">Save Company Details</button></div></form>`}
function monogram(name){return String(name||"Factory Hisab").trim().split(/\\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("")||"FH"}
function invoice(){let st=localStorage.getItem("fh_invoice_style")||"classic",ty=localStorage.getItem("fh_invoice_type")||"sale";return `<h1>Invoice Design Settings</h1><div class="hint">Yahan design aur invoice ki detail sirf ek baar select karke save karein. Print karte waqt ye options dobara nahi aayenge.</div><div class="panel no-print"><div class="formgrid"><div class="field"><label>Invoice design</label><select id="invoiceStyle"><option value="classic" ${st==="classic"?"selected":""}>1. Classic professional</option><option value="modern" ${st==="modern"?"selected":""}>2. Modern clean</option><option value="minimal" ${st==="minimal"?"selected":""}>3. Simple register</option><option value="custom" ${st==="custom"?"selected":""}>4. My uploaded invoice picture</option></select></div><div class="field"><label>Invoice type</label><select id="invoiceType"><option value="sale" ${ty==="sale"?"selected":""}>Sale Invoice</option><option value="full" ${ty==="full"?"selected":""}>Full Account Statement</option></select></div><div class="field" style="grid-column:1/-1"><label>Apni AI-made invoice picture/template (optional)</label><input id="invoiceTemplateFile" type="file" accept="image/*" onchange="saveInvoiceTemplate(this)"><small class="hint">Picture is browser/mobile mein save hogi. Custom design choose karne par invoice par lagegi.</small><div id="invoiceTemplateStatus" class="hint">${localStorage.getItem("fh_invoice_template")?'Custom invoice picture saved.':'Abhi custom picture add nahi ki.'}</div><button type="button" class="btn2" onclick="removeInvoiceTemplate()">Remove uploaded picture</button></div></div><div class="actions"><button class="btn" onclick="saveInvoiceSettings()">Save Invoice Settings</button><button class="btn2" onclick="page('quickinvoice')">Go to Print</button></div></div>`}
function saveInvoiceSettings(){localStorage.setItem("fh_invoice_style",document.getElementById("invoiceStyle").value);localStorage.setItem("fh_invoice_type",document.getElementById("invoiceType").value);alert("Invoice settings save ho gayi hain.");page("quickinvoice")}
function quickinvoice(){let f=getF(selected),now=new Date(),today=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");return `<h1>Print Invoice</h1><div class="panel no-print"><div class="hint">${esc(f?.name||"")} · ${esc(monthName(selectedMonth))}</div><div class="field" style="margin-top:12px"><label>Company name (optional)</label><input id="invoiceCompany" value="" placeholder="Naam likhna ho to likhein, warna khaali chhor dein"></div><div class="field" style="margin-top:12px"><label>Invoice Date (apni marzi ki date)</label><input id="invoiceIssueDate" type="date" value="${today}"></div><div class="actions"><button class="btn" onclick="makeInvoice()">Preview Invoice</button><button class="btn2" onclick="page('invoice')">Invoice Design Settings</button></div></div><div id="invoiceOut"></div>`}
function refreshInvoiceMonths(){let id=document.getElementById("invoiceF").value,sel=document.getElementById("invoiceMonth"),ms=monthsForFactory(id);sel.innerHTML=ms.map(m=>`<option value="${m}">${esc(monthName(m))}</option>`).join("");if(ms.includes(selectedMonth))sel.value=selectedMonth}
function saveInvoiceTemplate(input){let file=input.files?.[0];if(!file)return;if(!file.type.startsWith("image/")){alert("Image file select karein.");return}let r=new FileReader();r.onload=()=>{try{localStorage.setItem("fh_invoice_template",r.result);let x=document.getElementById("invoiceTemplateStatus");if(x)x.textContent="Invoice picture saved. Custom invoice design select karein."}catch(e){alert("Image bohat bari hai. Chhoti image select karein.")}};r.readAsDataURL(file)}
function removeInvoiceTemplate(){localStorage.removeItem("fh_invoice_template");let x=document.getElementById("invoiceTemplateStatus");if(x)x.textContent="Custom picture removed."}
function makeInvoice(){let id=selected,month=selectedMonth,full=(localStorage.getItem("fh_invoice_type")||"sale")==="full",style=localStorage.getItem("fh_invoice_style")||"classic",f=getF(id),company=(document.getElementById("invoiceCompany")?.value||"").trim();let mono=monogram(company),a=es(id).filter(e=>(e.date||"").slice(0,7)===month),sum=a.reduce((n,e)=>n+calc(e).sale,0),issueDate=document.getElementById("invoiceIssueDate")?.value||(()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")})(),issueDateText=issueDate?issueDate.split("-").reverse().join("/"):"",custom=localStorage.getItem("fh_invoice_template");let head="";if(!company){head=(style==="custom"&&custom?`<div class="custom-banner"><img src="${custom}" alt="Uploaded invoice design"></div>`:"")+`<div class="invhead"><div class="invcompany"><b>INVOICE</b><small>${esc(monthName(month))}</small></div><div class="invlabel"></div></div>`}else if(style==="modern")head=`<div class="invhead modernhead"><div class="invmono">${esc(mono)}</div><div class="invcompany"><b>${esc(company)}</b><small>FACTORY INVOICE · ${esc(monthName(month))}</small></div><div class="invlabel">INVOICE</div></div>`;else if(style==="minimal")head=`<div class="invhead minimalhead"><div><b>${esc(company)}</b><small>Factory / Commission Account</small></div><div class="invlabel">INVOICE</div></div><div class="minimalrule"></div>`;else if(style==="custom"&&custom)head=`<div class="custom-banner"><img src="${custom}" alt="Uploaded invoice design"></div><div class="invhead"><div class="invmono">${esc(mono)}</div><div class="invcompany"><b>${esc(company)}</b><small>Invoice · ${esc(monthName(month))}</small></div><div class="invlabel">INVOICE</div></div>`;else head=`<div class="invhead classichead"><div class="invmono">${esc(mono)}</div><div class="invcompany"><b>${esc(company)}</b><small>Sales Invoice / Account Statement</small><small>${esc(monthName(month))}</small></div><div class="invlabel">INVOICE</div></div>`;document.getElementById("invoiceOut").innerHTML=`<style>.invoice-paper{width:100%;max-width:800px;min-height:900px;margin:16px auto;background:#fff;color:#17231e;border:1px solid #d5ddd8;box-shadow:0 8px 28px #0001;padding:0;font-family:Arial,sans-serif}.invhead{display:flex;align-items:center;gap:14px;padding:24px;border-bottom:3px solid #176b52}.invmono{width:62px;height:62px;flex-shrink:0;display:grid;place-items:center;border-radius:12px;background:#176b52;color:white;font-size:24px;font-weight:900}.invcompany{flex:1;min-width:0}.invcompany b,.minimalhead b{display:block;font-size:22px;overflow-wrap:anywhere}.invcompany small,.minimalhead small{display:block;color:#66756e;font-size:11px;margin-top:4px}.invlabel{text-align:right;font-weight:900;letter-spacing:1px}.modernhead{background:#102d3a;color:white;border-bottom:6px solid #39b8a1}.modernhead .invmono{background:#39b8a1;color:#102d3a;border-radius:50%}.modernhead .invcompany small{color:#d5e7e7}.minimalhead{border-bottom:0;padding-bottom:14px}.minimalrule{height:5px;background:#222;margin:0 24px}.invoice-body{padding:24px}.billrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}.billrow small{color:#68786f;font-size:10px;letter-spacing:.7px}.billrow h2{margin:4px 0;font-size:20px}.invoice-paper table{width:100%;min-width:0;border-collapse:collapse;color:#17231e}.invoice-paper th,.invoice-paper td{padding:10px 7px;border-bottom:1px solid #e2e8e4;font-size:11px;text-align:left}.invoice-paper th{background:#edf4f0;color:#354b41}.modernhead+.invoice-body .invoice-paper th{background:#e2f5f1}.invoice-totals{margin:22px 0 0 auto;width:min(300px,100%);border-top:2px solid #176b52;padding-top:10px}.invoice-totals div{display:flex;justify-content:space-between;gap:16px;margin:6px 0}.invoice-sign{display:flex;justify-content:space-between;gap:20px;margin-top:55px;color:#66756e;font-size:11px}.custom-banner{padding:12px 18px 0}.custom-banner img{display:block;max-width:100%;max-height:160px;object-fit:contain;margin:auto}.custom-banner+.invhead{padding-top:12px}.invoice-paper .tablewrap{overflow:visible}@page{size:A4 portrait;margin:12mm}@media print{body,body .app{background:white!important;color:#17231e!important;max-width:none!important;margin:0!important;min-height:0!important}.invoice-paper{width:100%!important;max-width:none!important;min-height:0!important;margin:0!important;border:0!important;box-shadow:none!important;page-break-inside:avoid}.invoice-paper *{print-color-adjust:exact;-webkit-print-color-adjust:exact}.invoice-paper th,.invoice-paper td{font-size:9pt;padding:7px 5px}.invoice-paper .invoice-body{padding:8mm 0}.no-print,.top,.drawer,.drawerbg{display:none!important}main{padding:0!important}}</style><section class="invoice-paper">${head}<div class="invoice-body"><div class="billrow"><div><small>BILL TO / FACTORY</small><h2>${esc(f?.name||"")}</h2><div style="font-size:12px;color:#66756e">Period: ${esc(monthName(month))}</div></div><div style="text-align:right"><small>ISSUE DATE</small><b style="display:block;margin-top:5px">${esc(issueDateText)}</b></div></div><table><thead><tr><th>Date</th><th>Truck / Slip</th><th>Sale Rate</th><th>Mann</th><th>Amount</th>${full?"<th>Buy Total</th><th>Commission</th><th>Profit</th><th>Received</th><th>Balance</th>":""}</tr></thead><tbody>${a.map(e=>{let c=calc(e);return `<tr><td>${esc(e.date)}</td><td>${esc(e.truck)}</td><td>${cash(e.saleRate)}</td><td>${cash(e.saleMann)}</td><td>${cash(c.sale)}</td>${full?`<td>${cash(c.buy)}</td><td>${cash(c.commissionTotal)}</td><td>${cash(c.profit)}</td><td>${cash(e.received)}</td><td>${cash(c.balance)}</td>`:""}</tr>`}).join("")||`<tr><td colspan="${full?10:5}">No entries yet</td></tr>`}</tbody></table><div class="invoice-totals"><div><span>${full?"Total sale":"Invoice total"}</span><b>${cash(sum)}</b></div>${full?`<div><span>Net profit</span><b>${cash(a.reduce((n,e)=>n+calc(e).profit,0))}</b></div><div><span>Balance due</span><b>${cash(a.reduce((n,e)=>n+calc(e).balance,0))}</b></div>`:""}</div><div class="invoice-sign"><span>Thank you for your business.</span><span>Authorized Signature: __________________</span></div></div></section><div class="actions no-print"><button class="btn" onclick="window.print()">Print / Save A4 PDF</button><button class="btn2" onclick="page('invoice')">Back to Invoice Settings</button></div>`}
function render(){document.body.className=themes.find(t=>t.id===theme)?.cls||"t-light";document.getElementById("appTitle").textContent=localStorage.getItem("fh_brand")||"Sameer Baden Commission";let m=document.getElementById("main");m.innerHTML=({home, themes:themePage,months:monthFolders,ledger,entry,manage,investment,business,invoice,quickinvoice})[view]?.()||home();let ef=document.getElementById("entryForm");if(ef)ef.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(ef));if(editing){let i=entries.findIndex(x=>x.id===editing);if(i>=0)entries[i]={...entries[i],...d}}else entries.push({id:"e"+Date.now(),...d});selected=d.factoryId;selectedMonth=(d.date||selectedMonth).slice(0,7);save();view="ledger";render()};let bf=document.getElementById("brandForm");if(bf){let bi=bf.querySelector('[name="brand"]');if(bi)bi.oninput=()=>{let mp=document.getElementById("monoPreview");if(mp)mp.textContent=monogram(bi.value)};bf.onsubmit=e=>{e.preventDefault();localStorage.setItem("fh_brand",new FormData(bf).get("brand"));render()}}}
render();
